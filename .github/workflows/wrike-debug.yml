name: Wrike debug — list spaces & custom fields

# Run this manually from the Actions tab to see the API IDs and field
# names your Wrike token has access to. Useful when WRIKE_SPACE_ID
# rejects with a 400 or when a custom field isn't being found.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: List Wrike spaces (API IDs and titles)
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
          WRIKE_BASE_URL: ${{ vars.WRIKE_BASE_URL }}
        run: |
          echo "=== Wrike spaces visible to this token ==="
          noa-finder list-spaces

      - name: List Wrike custom fields
        env:
          WRIKE_TOKEN: ${{ secrets.WRIKE_TOKEN }}
          WRIKE_BASE_URL: ${{ vars.WRIKE_BASE_URL }}
        run: |
          echo "=== Wrike custom fields visible to this token ==="
          noa-finder list-custom-fields
